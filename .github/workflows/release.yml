name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build without publishing Release assets
        required: true
        type: string
      tag:
        description: Expected v-prefixed Cargo version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Match tag to Cargo version
        run: python3 scripts/package_release.py validate --tag "$RELEASE_TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
          - runner: macos-15
            target: aarch64-apple-darwin
            python: python3
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          rustc -vV
        env:
          TARGET: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Package release asset
        shell: bash
        run: >-
          "$PYTHON" scripts/package_release.py package
          --tag "$RELEASE_TAG"
          --target "$TARGET"
          --output-dir dist
        env:
          PYTHON: ${{ matrix.python }}
          TARGET: ${{ matrix.target }}

      - name: Stage target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify:
    name: Verify complete release set
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete asset set
        run: python3 scripts/package_release.py verify --tag "$RELEASE_TAG" --directory dist

  publish:
    name: Attach assets to GitHub Release
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload Release assets
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
